# damerchi.ir HTTPS | Django + gunicorn
# Use only when Let's Encrypt cert exists.
# Other sites (aria-tek.ir, otoino.ir) are untouched.

upstream damerchi_app {
    # Isolated from aria-tek (8001) and otoino (8000).
    server 127.0.0.1:8002;
}

server {
    listen 80;
    listen [::]:80;
    server_name damerchi.ir www.damerchi.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name damerchi.ir www.damerchi.ir;

    ssl_certificate     /etc/letsencrypt/live/damerchi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damerchi.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/damerchi.ir/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/damerchi.ir/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://damerchi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
