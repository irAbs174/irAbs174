# damerchi.ir HTTPS | use only when Let's Encrypt cert exists.
# Other sites (aria-tek.ir, otoino.ir) are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name damerchi.ir www.damerchi.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name damerchi.ir www.damerchi.ir;

    ssl_certificate     /etc/letsencrypt/live/damerchi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damerchi.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/damerchi.ir;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
