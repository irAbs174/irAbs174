# damerchi.ir — static portfolio
# Isolated vhost: does not modify aria-tek.ir or otoino.ir.

server {
    listen 80;
    listen [::]:80;
    server_name damerchi.ir www.damerchi.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        root /var/www/damerchi.ir;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
