# damerchi.ir | Django + gunicorn
# Isolated vhost: does not modify aria-tek.ir or otoino.ir.

upstream damerchi_app {
    # Isolated from aria-tek (8001) and otoino (8000).
    server 127.0.0.1:8002;
}

server {
    listen 80;
    listen [::]:80;
    server_name damerchi.ir www.damerchi.ir;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location /static/ {
        alias /var/www/damerchi.ir/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/damerchi.ir/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://damerchi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
